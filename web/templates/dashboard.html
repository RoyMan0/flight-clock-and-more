{% extends "base.html" %}
{% block title %}Dashboard — LED Matrix{% endblock %}

{% block content %}
<div x-data="dashboard()" x-init="init()">

  <!-- Top row: preview + current status -->
  <div class="row g-4 mb-4">

    <!-- Live Display Preview -->
    <div class="col-md-auto">
      <div class="card h-100">
        <div class="card-header d-flex align-items-center gap-2">
          <i class="bi bi-display text-success"></i> Live Preview
          <span class="badge ms-auto" :class="hasLive ? 'badge-live' : 'bg-secondary'" x-text="hasLive ? '✈ PLANE OVERHEAD' : 'Normal'"></span>
        </div>
        <div class="card-body d-flex align-items-center justify-content-center p-3">
          <img id="preview-img" class="matrix-preview"
               :src="snapshot || '/static/blank.png'"
               alt="Display preview" width="256" height="128">
        </div>
      </div>
    </div>

    <!-- Current Plugin + Rotation -->
    <div class="col">
      <div class="card h-100">
        <div class="card-header"><i class="bi bi-collection-play me-2"></i>Plugin Rotation</div>
        <div class="card-body">
          <div class="mb-3">
            <div class="stat-label">Now Showing</div>
            <div class="stat-value" x-text="activePlugin || '—'"></div>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <template x-for="pid in rotation" :key="pid">
              <span class="plugin-pill badge border px-3 py-2 fs-6"
                    :class="pid === activePlugin ? 'active' : 'bg-dark border-secondary text-secondary'"
                    @click="forcePlugin(pid)"
                    x-text="pid.replace('_', ' ')">
              </span>
            </template>
          </div>
          <div class="mt-3 text-muted small">Click a plugin to force-show it immediately.</div>
        </div>
      </div>
    </div>

    <!-- System Stats -->
    <div class="col-md-auto">
      <div class="card h-100">
        <div class="card-header"><i class="bi bi-cpu me-2"></i>System</div>
        <div class="card-body d-flex flex-column gap-3">
          <div class="row g-3 text-center">
            <div class="col-6">
              <div class="stat-value" x-text="sys.cpu_temp || '—'"></div>
              <div class="stat-label">CPU Temp</div>
            </div>
            <div class="col-6">
              <div class="stat-value" x-text="sys.uptime || '—'"></div>
              <div class="stat-label">Uptime</div>
            </div>
            <div class="col-12">
              <div class="progress" style="height:6px">
                <div class="progress-bar bg-success" :style="`width:${sys.memory?.pct || 0}%`"></div>
              </div>
              <div class="stat-label mt-1" x-text="`Memory: ${sys.memory?.used_mb || 0}/${sys.memory?.total_mb || 0} MB`"></div>
            </div>
          </div>
          <div class="border-top pt-3 d-flex flex-column gap-2">
            <button class="btn btn-sm btn-outline-warning w-100"
                    :disabled="sysActionPending"
                    @click="systemAction('restart-app', 'Restart the application?')">
              <i class="bi bi-arrow-clockwise me-1"></i>Restart Application
            </button>
            <button class="btn btn-sm btn-outline-info w-100"
                    :disabled="sysActionPending"
                    @click="systemAction('reboot', 'Reboot the Pi? This will take about a minute.')">
              <i class="bi bi-bootstrap-reboot me-1"></i>Reboot System
            </button>
            <button class="btn btn-sm btn-outline-danger w-100"
                    :disabled="sysActionPending"
                    @click="systemAction('shutdown', 'Shut down the Pi? You will need physical access to turn it back on.')">
              <i class="bi bi-power me-1"></i>Shut Down System
            </button>
            <div x-show="sysActionMsg" x-text="sysActionMsg" class="text-center small text-muted mt-1"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Overhead Flights -->
  <div class="row g-4 mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header"><i class="bi bi-airplane-fill text-warning me-2"></i>Overhead Now</div>
        <div class="card-body p-0">
          <template x-if="currentFlights.length === 0">
            <div class="text-center text-muted py-4"><i class="bi bi-cloud" style="font-size:2rem"></i><br>No flights overhead</div>
          </template>
          <template x-if="currentFlights.length > 0">
            <ul class="list-group list-group-flush">
              <template x-for="f in currentFlights" :key="f.callsign">
                <li class="list-group-item bg-transparent border-secondary">
                  <div class="d-flex justify-content-between align-items-start">
                    <div>
                      <span class="fw-bold text-warning" x-text="f.callsign"></span>
                      <span class="text-muted ms-2" x-text="f.airline"></span>
                    </div>
                    <span class="badge bg-secondary" x-text="f.plane"></span>
                  </div>
                  <div class="small text-muted mt-1">
                    <span x-text="f.origin || '?'"></span>
                    <i class="bi bi-arrow-right mx-1"></i>
                    <span x-text="f.destination || '?'"></span>
                    <span class="ms-3" x-text="`${f.distance?.toFixed(1)} mi ${f.direction}`"></span>
                  </div>
                </li>
              </template>
            </ul>
          </template>
        </div>
      </div>
    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function dashboard() {
  return {
    snapshot: '',
    activePlugin: '',
    rotation: [],
    hasLive: false,
    sys: {},
    currentFlights: [],
    sysActionPending: false,
    sysActionMsg: '',
    _es: null,

    init() {
      this.startSSE();
      this.loadCurrentFlights();
      setInterval(() => { this.loadCurrentFlights(); }, 5000);
    },

    startSSE() {
      this._es = new EventSource('/api/stream/status');
      this._es.onmessage = (e) => {
        const d = JSON.parse(e.data);
        this.activePlugin = d.active_plugin || '';
        this.rotation = d.rotation || [];
        this.sys = d.sys || {};
        this.hasLive = d.plugins?.flight_tracker?.has_live || false;
        if (d.snapshot) this.snapshot = d.snapshot;
      };
      this._es.onerror = () => {
        setTimeout(() => this.startSSE(), 3000);
      };
    },

    forcePlugin(pid) {
      fetch(`/api/display/show/${pid}`, {method: 'POST'})
        .then(r => r.json())
        .then(d => { if (d.ok) this.activePlugin = pid; });
    },

    async systemAction(action, confirmMsg) {
      if (!confirm(confirmMsg)) return;
      this.sysActionPending = true;
      this.sysActionMsg = action === 'restart-app' ? 'Restarting…' : action === 'reboot' ? 'Rebooting…' : 'Shutting down…';
      try {
        await fetch(`/api/system/${action}`, {method: 'POST'});
      } catch (_) {}
      if (action === 'restart-app') {
        this.sysActionMsg = 'Restarting — page will reload shortly…';
        setTimeout(() => { window.location.reload(); }, 5000);
      } else {
        this.sysActionMsg = action === 'reboot' ? 'Rebooting — come back in ~60s' : 'Shut down. Goodbye.';
      }
    },

    loadCurrentFlights() {
      fetch('/api/flights/current')
        .then(r => r.json())
        .then(d => { this.currentFlights = d || []; });
    },

  };
}
</script>
{% endblock %}
