<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LED Matrix{% endblock %}</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0d0d0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #7df9aa !important; }
    .nav-link.active { color: #7df9aa !important; }
    .card { background: #16181c; border: 1px solid #2a2d35; border-radius: 12px; }
    .card-header { background: #1e2128; border-bottom: 1px solid #2a2d35; font-weight: 600; }
    .badge-live { background: #ff4500; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .matrix-preview { image-rendering: pixelated; border: 2px solid #2a2d35; border-radius: 8px; background: #000; }
    .plugin-pill { cursor: pointer; transition: background .2s; }
    .plugin-pill.active { background: #1a3a2a; border-color: #7df9aa; color: #7df9aa; }
    .plugin-pill:hover { background: #1e2128; }
    .stat-value { font-size: 1.4rem; font-weight: 700; color: #7df9aa; }
    .stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: .5px; }
    #preview-img { width: 256px; height: 128px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary mb-4" style="background:#16181c">
  <div class="container-fluid">
    <a class="navbar-brand" href="/"><i class="bi bi-grid-3x3-gap-fill me-2"></i>LED Matrix</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'pages.dashboard' %}active{% endif %}" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'pages.config_page' %}active{% endif %}" href="/config"><i class="bi bi-sliders me-1"></i>Config</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'pages.display_page' %}active{% endif %}" href="/display"><i class="bi bi-display me-1"></i>Display</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'pages.flights_page' %}active{% endif %}" href="/flights"><i class="bi bi-airplane me-1"></i>Flights</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint == 'pages.about_page' %}active{% endif %}" href="/about"><i class="bi bi-info-circle me-1"></i>About</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS + Alpine.js + Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
